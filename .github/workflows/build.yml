name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build client EXE
        run: |
          pyinstaller --onefile --windowed --name WormShadowClient ^
            --add-data "client/ui/theme.qss;client/ui" ^
            client/main.py

      - name: Build server EXE
        run: |
          pyinstaller --onefile --name WormShadowServer ^
            --hidden-import uvicorn.logging ^
            --hidden-import uvicorn.loops.auto ^
            --hidden-import uvicorn.protocols.http.auto ^
            --hidden-import uvicorn.protocols.websockets.auto ^
            --hidden-import uvicorn.lifespan.on ^
            run_server_exe.py

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormShadowClient
          path: dist/WormShadowClient.exe

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: WormShadowServer
          path: dist/WormShadowServer.exe
